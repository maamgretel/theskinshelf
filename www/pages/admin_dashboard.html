<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin Dashboard — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="../css/seller.css">
  <style>
    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; padding-bottom: 60px; align-items: start; }
    .lead { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .lead:last-child { border-bottom: none; }
    .lead img { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; background: var(--cream-2); }
    .lead .av { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--cream-2); }
    .lead .nm { font-weight: 600; font-size: .92rem; color: var(--ink); }
    .lead .meta { font-size: .78rem; color: var(--muted); }
    .lead .amt { margin-left: auto; font-weight: 700; white-space: nowrap; }
    @media (max-width: 860px) { .dash-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="admin-header"></div>

  <div class="container">
    <div class="page-head">
      <div><span class="eyebrow">Admin</span><h1 id="hello">Overview</h1><p>Everything happening across The Skin Shelf.</p></div>
      <a class="btn btn-soft" href="admin_orders.html">Manage orders →</a>
    </div>

    <div class="stat-grid" id="stats">
      <div class="stat-card skeleton" style="height:96px"></div>
      <div class="stat-card skeleton" style="height:96px"></div>
      <div class="stat-card skeleton" style="height:96px"></div>
      <div class="stat-card skeleton" style="height:96px"></div>
    </div>

    <div class="dash-grid">
      <div class="panel">
        <div class="panel-head"><h3>Recent orders</h3><a href="admin_orders.html">View all →</a></div>
        <div class="tbl-wrap"><table class="tbl" id="recent">
          <thead><tr><th>Product</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead>
          <tbody><tr><td colspan="4"><div class="spin"></div></td></tr></tbody>
        </table></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Top sellers</h3><a href="sellers.html">All sellers →</a></div>
        <div id="sellers"><div class="spin"></div></div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/seller.js"></script>
  <script>
    if (SELLER.requireAdmin()) { SELLER.mountAdminTopbar('dashboard'); init(); }

    async function init() {
      const u = TSS.user();
      document.getElementById('hello').textContent = `Welcome, ${(u.name||'Admin').split(' ')[0]}`;

      try {
        const d = await SELLER.api('/api/admin/dashboard-data');
        const a = d.analytics || d;
        document.getElementById('stats').innerHTML = `
          <div class="stat-card accent"><span class="lbl">💰 Total sales</span><span class="val">${TSS.money(a.total_sales)}</span><span class="sub">platform-wide</span></div>
          <div class="stat-card"><span class="lbl">📦 Orders</span><span class="val">${a.total_orders}</span><span class="sub">all-time</span></div>
          <div class="stat-card"><span class="lbl">👥 Users</span><span class="val">${a.total_users}</span><span class="sub">customers + sellers</span></div>
          <div class="stat-card"><span class="lbl">🧴 Products</span><span class="val">${a.total_products}</span><span class="sub">listed</span></div>`;
      } catch (e) { document.getElementById('stats').innerHTML = `<div class="empty" style="grid-column:1/-1">Couldn't load stats — ${e.message}</div>`; }

      try {
        const d = await SELLER.api('/api/admin/orders');
        const rows = (d.orders || []).slice(0, 6);
        document.querySelector('#recent tbody').innerHTML = rows.length ? rows.map(o => `
          <tr>
            <td><div class="prod-cell"><img src="${o.product_image||''}" onerror="this.src=window.TSS_PLACEHOLDER"><div class="nm">${o.product_name}</div></div></td>
            <td>${o.customer_name || '—'}</td>
            <td class="num"><b>${TSS.money(o.total_price)}</b></td>
            <td>${SELLER.statusBadge(o.status)}</td>
          </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:24px">No orders yet</td></tr>';
      } catch { document.querySelector('#recent tbody').innerHTML = '<tr><td colspan="4">Couldn\'t load</td></tr>'; }

      try {
        const d = await SELLER.api('/api/admin/sellers');
        const rows = (d.sellers || []).sort((a,b)=>b.total_sales-a.total_sales).slice(0, 5);
        const DEFAULT_AV = 'https://res.cloudinary.com/dwgvlwkyt/image/upload/v1751856106/default-avatar.jpg';
        document.getElementById('sellers').innerHTML = rows.length ? rows.map(s => `
          <div class="lead">
            <img class="av" src="${s.profile_pic||DEFAULT_AV}" onerror="this.src='${DEFAULT_AV}'">
            <div><div class="nm">${s.name}</div><div class="meta">${s.product_count} products · ${s.total_orders} orders</div></div>
            <span class="amt">${TSS.money(s.total_sales)}</span>
          </div>`).join('') : '<div class="empty" style="padding:18px">No sellers yet</div>';
      } catch { document.getElementById('sellers').innerHTML = '<div class="empty">Couldn\'t load</div>'; }
    }
  </script>
</body>
</html>
