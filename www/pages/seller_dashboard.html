<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seller Dashboard — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="../css/seller.css">
  <style>
    .dash-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; margin-top: 18px; padding-bottom: 60px; align-items: start; }
    .dash-col { display: flex; flex-direction: column; gap: 18px; }
    .low-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .low-item:last-child { border-bottom: none; }
    .low-item img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--cream-2); }
    .low-item .nm { font-weight: 600; font-size: .9rem; color: var(--ink); }
    .top-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .top-item:last-child { border-bottom: none; }
    .top-item img { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; background: var(--cream-2); }
    .top-item .rank { font-family: var(--serif); font-size: 1.1rem; color: var(--muted); width: 22px; }
    .top-item .nm { font-weight: 600; font-size: .9rem; color: var(--ink); }
    .top-item .meta { font-size: .78rem; color: var(--muted); }
    .top-item .rev { margin-left: auto; font-weight: 700; white-space: nowrap; }
    @media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="seller-header"></div>

  <div class="container">
    <div class="page-head">
      <div>
        <span class="eyebrow">Seller Studio</span>
        <h1 id="hello">Welcome back</h1>
        <p id="today-line">Here's how your shop is doing.</p>
      </div>
      <a class="btn btn-primary" href="add_product.html">+ Add product</a>
    </div>

    <div class="stat-grid" id="stats">
      <div class="stat-card skeleton" style="height:96px"></div>
      <div class="stat-card skeleton" style="height:96px"></div>
      <div class="stat-card skeleton" style="height:96px"></div>
      <div class="stat-card skeleton" style="height:96px"></div>
    </div>

    <div class="dash-grid">
      <div class="dash-col">
        <div class="panel">
          <div class="panel-head"><h3>Revenue trend</h3><span class="muted" style="font-size:.82rem">last 6 months</span></div>
          <div class="bars" id="trend"><div class="spin"></div></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Recent orders</h3><a href="orders.html">Manage orders →</a></div>
          <div class="tbl-wrap"><table class="tbl" id="recent">
            <thead><tr><th>Product</th><th>Customer</th><th>Qty</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
            <tbody><tr><td colspan="6"><div class="spin"></div></td></tr></tbody>
          </table></div>
        </div>
      </div>

      <div class="dash-col">
        <div class="panel">
          <div class="panel-head"><h3>Top sellers</h3></div>
          <div id="top"><div class="spin"></div></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Low stock</h3><a href="product_seller.html">Restock →</a></div>
          <div id="low"><div class="spin"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/seller.js"></script>
  <script>
    if (SELLER.requireSeller()) {
      SELLER.mountTopbar('dashboard');
      init();
    }

    async function init() {
      const u = TSS.user();
      document.getElementById('hello').textContent = `Welcome back, ${(u.name || 'Seller').split(' ')[0]}`;

      // stats
      try {
        const ov = await SELLER.api('/api/seller/dashboard/overview');
        const s = ov.data.stats;
        document.getElementById('stats').innerHTML = `
          <div class="stat-card accent"><span class="lbl">💰 Total revenue</span><span class="val">${TSS.money(s.total_revenue)}</span><span class="sub">from delivered &amp; shipped orders</span></div>
          <div class="stat-card"><span class="lbl">📦 Orders</span><span class="val">${s.total_orders}</span><span class="sub">${s.pending_orders} pending action</span></div>
          <div class="stat-card"><span class="lbl">🧴 Products</span><span class="val">${s.total_products}</span><span class="sub">live in your shop</span></div>
          <div class="stat-card"><span class="lbl">⚠️ Low stock</span><span class="val">${s.low_stock_count}</span><span class="sub">need restocking</span></div>`;
        if (s.pending_orders > 0) document.getElementById('today-line').innerHTML = `You have <b style="color:var(--accent)">${s.pending_orders} pending order${s.pending_orders>1?'s':''}</b> waiting to be shipped.`;
      } catch (e) { document.getElementById('stats').innerHTML = `<div class="empty" style="grid-column:1/-1">Couldn't load stats — ${e.message}</div>`; }

      // revenue trend
      try {
        const t = await SELLER.api('/api/seller/dashboard/revenue-trend');
        const rows = t.data || [];
        const el = document.getElementById('trend');
        if (!rows.length) { el.innerHTML = '<div class="empty" style="padding:20px;width:100%">No sales yet — your first order will show up here.</div>'; }
        else {
          const max = Math.max(...rows.map(r => Number(r.revenue))) || 1;
          el.innerHTML = rows.map(r => {
            const h = Math.max(4, Math.round(Number(r.revenue) / max * 140));
            const mo = new Date(r.month + '-02').toLocaleDateString('en-PH', { month: 'short' });
            return `<div class="bar-col"><div class="bar" style="height:${h}px"><span class="tip">${TSS.money(r.revenue)}</span></div><span class="mo">${mo}</span></div>`;
          }).join('');
        }
      } catch { document.getElementById('trend').innerHTML = '<div class="empty" style="width:100%">Couldn\'t load trend</div>'; }

      // recent orders
      try {
        const ro = await SELLER.api('/api/seller/dashboard/recent-orders');
        const rows = (ro.data || []).slice(0, 6);
        const tb = document.querySelector('#recent tbody');
        tb.innerHTML = rows.length ? rows.map(o => `
          <tr>
            <td><div class="prod-cell"><img src="${o.product_image||''}" onerror="this.src=window.TSS_PLACEHOLDER"><div><div class="nm">${o.product_name}</div></div></div></td>
            <td>${o.customer_name || '—'}</td>
            <td class="num">${o.quantity}</td>
            <td class="num"><b>${TSS.money(o.total_price)}</b></td>
            <td>${SELLER.statusBadge(o.status)}</td>
            <td class="num">${SELLER.fmtDate(o.order_date)}</td>
          </tr>`).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:26px">No orders yet</td></tr>';
      } catch { document.querySelector('#recent tbody').innerHTML = '<tr><td colspan="6">Couldn\'t load orders</td></tr>'; }

      // top products
      try {
        const tp = await SELLER.api('/api/seller/dashboard/top-products');
        const rows = (tp.data || []).slice(0, 5);
        document.getElementById('top').innerHTML = rows.length ? rows.map((p, i) => `
          <div class="top-item">
            <span class="rank">${i + 1}</span>
            <img src="${p.image||''}" onerror="this.src=window.TSS_PLACEHOLDER">
            <div><div class="nm">${p.name}</div><div class="meta">${p.total_sold} sold · ${TSS.money(p.price)}</div></div>
            <span class="rev">${TSS.money(p.total_revenue)}</span>
          </div>`).join('') : '<div class="empty" style="padding:18px">No sales yet</div>';
      } catch { document.getElementById('top').innerHTML = '<div class="empty">Couldn\'t load</div>'; }

      // low stock
      try {
        const ls = await SELLER.api('/api/seller/dashboard/low-stock');
        const rows = (ls.data || []).slice(0, 5);
        document.getElementById('low').innerHTML = rows.length ? rows.map(p => `
          <div class="low-item">
            <img src="${p.image||''}" onerror="this.src=window.TSS_PLACEHOLDER">
            <div><div class="nm">${p.name}</div></div>
            <span style="margin-left:auto">${SELLER.stockBadge(p.stock)}</span>
          </div>`).join('') : '<div class="empty" style="padding:18px">🎉 All products are well stocked</div>';
      } catch { document.getElementById('low').innerHTML = '<div class="empty">Couldn\'t load</div>'; }
    }
  </script>
</body>
</html>
