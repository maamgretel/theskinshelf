<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orders — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="../css/seller.css">
  <style>
    .grp-tag { font-size: .7rem; font-weight: 700; color: var(--muted); background: var(--cream-2); border-radius: var(--r-pill); padding: .15rem .5rem; margin-left: .4rem; }
    .buyer { font-size: .82rem; color: var(--muted); }
    .actions-cell { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
    .page-wrap { padding-bottom: 60px; }
  </style>
</head>
<body>
  <div id="seller-header"></div>

  <div class="container page-wrap">
    <div class="page-head">
      <div><span class="eyebrow">Fulfilment</span><h1>Orders</h1><p id="sub">Ship pending orders — stock is deducted when you ship.</p></div>
    </div>

    <div class="status-tabs chip-row" id="tabs"></div>

    <div class="panel" style="padding:10px 18px">
      <div class="tbl-wrap"><table class="tbl" id="otable">
        <thead><tr><th>Order</th><th>Product</th><th>Customer</th><th>Qty</th><th>Total</th><th>Status</th><th>Date</th><th style="text-align:right">Actions</th></tr></thead>
        <tbody><tr><td colspan="8"><div class="spin"></div></td></tr></tbody>
      </table></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/seller.js"></script>
  <script>
    const STATUSES = ['All', 'Pending', 'Shipped', 'Delivered', 'Cancelled'];
    let all = [], active = 'All';

    if (SELLER.requireSeller()) {
      SELLER.mountTopbar('orders');
      load();
    }

    async function load() {
      try {
        all = await SELLER.api('/api/seller/orders');
        renderTabs(); render();
      } catch (e) {
        document.querySelector('#otable tbody').innerHTML = `<tr><td colspan="8" style="text-align:center;padding:26px">Couldn't load orders — ${e.message}</td></tr>`;
      }
    }

    function renderTabs() {
      const counts = s => s === 'All' ? all.length : all.filter(o => o.status === s).length;
      document.getElementById('tabs').innerHTML = STATUSES.map(s =>
        `<button class="chip ${active===s?'active':''}" data-s="${s}">${s} <span style="opacity:.65">(${counts(s)})</span></button>`).join('');
      document.querySelectorAll('#tabs .chip').forEach(b => b.onclick = () => { active = b.dataset.s; renderTabs(); render(); });
      const pend = counts('Pending');
      document.getElementById('sub').innerHTML = pend
        ? `<b style="color:var(--accent)">${pend} order${pend>1?'s':''}</b> waiting to be shipped — stock is deducted when you ship.`
        : 'All caught up! Stock is deducted when you ship an order.';
    }

    function render() {
      const list = active === 'All' ? all : all.filter(o => o.status === active);
      const tb = document.querySelector('#otable tbody');
      if (!list.length) { tb.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:30px">No ${active === 'All' ? '' : active.toLowerCase() + ' '}orders yet</td></tr>`; return; }
      tb.innerHTML = list.map(o => `
        <tr data-id="${o.id}">
          <td class="num"><b>#${o.id}</b>${o.grouped_order_id ? `<span class="grp-tag" title="Part of a multi-item order">grp</span>` : ''}</td>
          <td><div class="prod-cell"><img src="${o.product_image||''}" onerror="this.src=window.TSS_PLACEHOLDER"><div><div class="nm">${o.product_name}</div></div></div></td>
          <td><div>${o.buyer_name || '—'}</div></td>
          <td class="num">${o.quantity}</td>
          <td class="num"><b>${TSS.money(o.total_price)}</b><div class="buyer">${TSS.money(o.merchandise_subtotal)} + tax/ship</div></td>
          <td>${SELLER.statusBadge(o.status)}</td>
          <td class="num">${o.formatted_date || SELLER.fmtDate(o.order_date)}</td>
          <td><div class="actions-cell">${actionsFor(o)}</div></td>
        </tr>`).join('');

      tb.querySelectorAll('tr[data-id]').forEach(row => {
        const id = Number(row.dataset.id);
        const o = all.find(x => Number(x.id) === id);
        row.querySelectorAll('[data-act]').forEach(btn => {
          btn.onclick = () => updateStatus(o, btn.dataset.act);
        });
      });
    }

    function actionsFor(o) {
      switch (o.status) {
        case 'Pending':
          return `<button class="act-btn success" data-act="Shipped">🚚 Ship</button>
                  <button class="act-btn danger" data-act="Cancelled">Cancel</button>`;
        case 'Shipped':
          return `<button class="act-btn primary" data-act="Delivered">✓ Mark delivered</button>`;
        default:
          return '<span class="muted" style="font-size:.8rem">—</span>';
      }
    }

    async function updateStatus(o, status) {
      const messages = {
        'Shipped':   [`Ship order #${o.id}?`, `${o.quantity} × ${o.product_name} for ${o.buyer_name}. Stock will be deducted.`, 'Ship order', false],
        'Delivered': [`Mark #${o.id} as delivered?`, `Confirm that ${o.buyer_name} received the order.`, 'Mark delivered', false],
        'Cancelled': [`Cancel order #${o.id}?`, `${o.quantity} × ${o.product_name}. The customer will see it as cancelled.`, 'Cancel order', true],
      };
      const [t, s, ok, danger] = messages[status];
      if (!await SELLER.confirm(t, s, ok, danger)) return;
      try {
        await SELLER.api('/api/seller/orders/update-status', { method: 'POST', body: JSON.stringify({ order_ids: [o.id], status }) });
        TSS.toast(`Order #${o.id} → ${status}`, 'success');
        await load();
      } catch (e) { TSS.toast(e.message, 'error'); }
    }
  </script>
</body>
</html>
