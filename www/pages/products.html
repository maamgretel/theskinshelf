<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Products — Admin — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="../css/seller.css">
  <style>.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.toolbar .input-search{flex:1;min-width:220px}.toolbar select{padding:.65rem 1rem;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--paper);font-family:inherit;font-weight:600;font-size:.85rem}.page-wrap{padding-bottom:60px}</style>
</head>
<body>
  <div id="admin-header"></div>
  <div class="container page-wrap">
    <div class="page-head"><div><span class="eyebrow">Admin</span><h1>All products</h1><p id="sub">Everything listed across all shops.</p></div></div>
    <div class="toolbar">
      <div class="input-search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="search" placeholder="Search products…"></div>
      <select id="catFilter"><option value="">All categories</option></select>
    </div>
    <div class="panel" style="padding:10px 18px">
      <div class="tbl-wrap"><table class="tbl" id="tbl">
        <thead><tr><th>Product</th><th>Category</th><th>Seller</th><th>Price</th><th>Stock</th></tr></thead>
        <tbody><tr><td colspan="5"><div class="spin"></div></td></tr></tbody>
      </table></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/seller.js"></script>
  <script>
    let all = [], search = '', cat = '';
    if (SELLER.requireAdmin()) { SELLER.mountAdminTopbar('products'); load(); }

    async function load() {
      try {
        all = (await SELLER.api('/api/admin/products')).products || [];
        document.getElementById('sub').textContent = `${all.length} products across all shops.`;
        const cats = [...new Set(all.map(p=>p.category_name).filter(Boolean))].sort();
        document.getElementById('catFilter').innerHTML += cats.map(c=>`<option value="${c}">${c}</option>`).join('');
        render();
      } catch (e) { document.querySelector('#tbl tbody').innerHTML = `<tr><td colspan="5" style="text-align:center;padding:24px">Couldn't load — ${e.message}</td></tr>`; }
    }
    document.getElementById('search').addEventListener('input', e => { search = e.target.value.toLowerCase().trim(); render(); });
    document.getElementById('catFilter').addEventListener('change', e => { cat = e.target.value; render(); });

    function render() {
      let rows = all;
      if (cat) rows = rows.filter(p => p.category_name === cat);
      if (search) rows = rows.filter(p => (p.name||'').toLowerCase().includes(search) || (p.seller_name||'').toLowerCase().includes(search));
      const tb = document.querySelector('#tbl tbody');
      if (!rows.length) { tb.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:26px">No products found</td></tr>'; return; }
      tb.innerHTML = rows.map(p => `
        <tr>
          <td><div class="prod-cell"><img src="${p.image||''}" onerror="this.src=window.TSS_PLACEHOLDER"><div class="nm">${p.name}</div></div></td>
          <td><span class="badge badge-muted">${p.category_name || 'Uncategorised'}</span></td>
          <td>${p.seller_name || '—'}</td>
          <td class="num"><b>${TSS.money(p.price)}</b></td>
          <td>${SELLER.stockBadge(p.stock)}</td>
        </tr>`).join('');
    }
  </script>
</body>
</html>
