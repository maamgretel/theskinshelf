<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notifications — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="../css/seller.css">
  <style>
    .notif { display: flex; gap: 14px; align-items: flex-start; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; margin-bottom: 12px; transition: background .2s; }
    .notif.unread { border-color: var(--accent); background: linear-gradient(var(--accent-soft), var(--accent-soft)) padding-box; }
    .notif .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex-shrink: 0; }
    .notif.read .dot { background: var(--line); }
    .notif .msg { color: var(--ink); }
    .notif .time { font-size: .8rem; color: var(--muted); margin-top: 4px; }
    .n-head { display: flex; justify-content: space-between; align-items: center; padding: 30px 0 18px; flex-wrap: wrap; gap: 1rem; }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <div id="seller-header"></div>

  <div class="container" style="padding-bottom:60px; max-width:820px">
    <div class="n-head">
      <div><span class="eyebrow">Updates</span><h1 style="font-size:clamp(1.8rem,3.5vw,2.4rem)">Notifications</h1></div>
      <button class="btn btn-soft btn-sm" id="markAll">Mark all as read</button>
    </div>
    <div id="list"><div class="spin"></div></div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/seller.js"></script>
  <script>
    if (!TSS.requireLogin('Please sign in to view notifications')) { /* redirect */ }
    else init();

    function mountHeader() {
      const u = TSS.user();
      if (u.role === 'seller') { document.getElementById('app-header').remove(); SELLER.mountTopbar('notifications'); }
      else { document.getElementById('seller-header').remove(); TSS.mountHeader('orders'); TSS.mountFooter(); }
    }

    async function init() {
      mountHeader();
      await load();
      document.getElementById('markAll').onclick = markAll;
    }

    async function load() {
      const list = document.getElementById('list');
      try {
        const r = await fetch(`${TSS.API}/api/notifications`, { headers: TSS.authHeaders() });
        const data = await r.json();
        const items = Array.isArray(data) ? data : (data.notifications || []);
        if (!items.length) { list.innerHTML = `<div class="empty"><div class="ic">🔔</div><h3>No notifications yet</h3><p>Order updates and news will appear here.</p></div>`; return; }
        list.innerHTML = items.map(n => `
          <div class="notif ${Number(n.is_read) ? 'read' : 'unread'}">
            <span class="dot"></span>
            <div style="flex:1"><div class="msg">${n.message}</div><div class="time">${timeAgo(n.created_at)}</div></div>
          </div>`).join('');
      } catch { list.innerHTML = `<div class="empty"><div class="ic">🌸</div><h3>Couldn't load notifications</h3></div>`; }
    }

    async function markAll() {
      try {
        await fetch(`${TSS.API}/api/notifications/mark-as-read`, { method:'POST', headers: TSS.authHeaders(), body: '{}' });
        TSS.toast('All caught up ✓', 'success');
        await load();
      } catch { TSS.toast('Could not update', 'error'); }
    }

    function timeAgo(d) {
      try {
        const diff = (Date.now() - new Date(d)) / 1000;
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff/60) + 'm ago';
        if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
        if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
        return new Date(d).toLocaleDateString('en-PH', { month:'short', day:'numeric' });
      } catch { return ''; }
    }
  </script>
</body>
</html>
