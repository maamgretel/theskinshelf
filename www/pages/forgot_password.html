<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reset password — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <style>.auth-aside::after { background-image: var(--bg); }</style>
</head>
<body>
  <div class="auth-wrap">
    <aside class="auth-aside" style="--bg:url('https://images.unsplash.com/photo-1570194065650-d99fb4bedf0a?w=900&q=80&auto=format&fit=crop'), url('https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=900&q=80&auto=format&fit=crop')">
      <a class="brand" href="../index.html"><span class="dot"></span> The Skin Shelf</a>
      <div class="pitch">
        <h2>Forgot your password?</h2>
        <p>No worries — we'll send a code to your email so you can set a new one.</p>
      </div>
      <div class="quotes"><div class="q">🔒 Secure reset</div></div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <span class="eyebrow">Reset password</span>
        <h1 id="title">Forgot password</h1>
        <p class="lede" id="lede">Enter your email and we'll send you a reset code.</p>

        <div class="auth-alert err" id="alert"></div>

        <!-- Step 1: email -->
        <form id="emailForm">
          <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="you@email.com" required></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="emailBtn">Send reset code</button>
        </form>

        <!-- Step 2: otp + new password -->
        <form id="resetForm" style="display:none">
          <div class="field"><label for="otp">Reset code</label><input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code" required></div>
          <div class="field">
            <label for="newpw">New password</label>
            <div class="pw-wrap">
              <input type="password" id="newpw" placeholder="At least 6 characters" minlength="6" required>
              <button type="button" class="toggle" data-toggle="newpw">Show</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetBtn">Reset password</button>
          <div id="debugBox" class="debug-otp" style="display:none">Local demo code: <b id="debugOtp"></b></div>
        </form>

        <div class="foot"><a href="login.html">← Back to sign in</a></div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script>
    const alertEl = document.getElementById('alert');
    function showErr(m){ alertEl.textContent = m; alertEl.className = 'auth-alert err show'; }
    function showOk(m){ alertEl.textContent = m; alertEl.className = 'auth-alert ok show'; }
    let email = '';

    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
      const inp = document.getElementById(b.dataset.toggle);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      b.textContent = inp.type === 'password' ? 'Show' : 'Hide';
    });

    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.className = 'auth-alert';
      email = document.getElementById('email').value.trim();
      const btn = document.getElementById('emailBtn');
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const r = await fetch(`${TSS.API}/api/auth/forgot-password`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || d.message || 'Could not send reset code');
        document.getElementById('emailForm').style.display = 'none';
        document.getElementById('resetForm').style.display = 'block';
        document.getElementById('title').textContent = 'Check your email';
        document.getElementById('lede').innerHTML = `We sent a reset code to <b>${email}</b>.`;
        showOk('Reset code sent!');
        if (d.debug_otp) { document.getElementById('debugBox').style.display = 'block'; document.getElementById('debugOtp').textContent = d.debug_otp; }
      } catch (err) {
        showErr(err.message);
        btn.disabled = false; btn.textContent = 'Send reset code';
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.className = 'auth-alert';
      const otp = document.getElementById('otp').value.trim();
      const newpw = document.getElementById('newpw').value;
      if (newpw.length < 6) { showErr('Password must be at least 6 characters'); return; }
      const btn = document.getElementById('resetBtn');
      btn.disabled = true; btn.textContent = 'Resetting…';
      try {
        const r = await fetch(`${TSS.API}/api/auth/verify-otp`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, otp, new_password: newpw }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || d.message || 'Invalid or expired code');
        showOk('Password reset! Redirecting to sign in…');
        setTimeout(() => location.href = 'login.html', 1200);
      } catch (err) {
        showErr(err.message);
        btn.disabled = false; btn.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
