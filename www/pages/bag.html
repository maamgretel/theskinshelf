<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your Bag — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <style>
    .bag-head { padding: 34px 0 8px; }
    .bag-head h1 { font-size: clamp(1.8rem, 3.5vw, 2.6rem); }
    .bag-layout { display: grid; grid-template-columns: 1fr 360px; gap: 34px; align-items: start; padding: 20px 0 70px; }
    .bag-items { display: flex; flex-direction: column; gap: 14px; }
    .bag-item { display: grid; grid-template-columns: 92px 1fr auto; gap: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; align-items: center; }
    .bag-item img { width: 92px; height: 92px; border-radius: var(--r); object-fit: cover; background: var(--cream-2); }
    .bag-item .nm { font-weight: 600; color: var(--ink); }
    .bag-item .unit { color: var(--muted); font-size: .85rem; margin-top: .2rem; }
    .bag-item .controls { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
    .bag-item .rm { background: none; border: none; color: var(--muted); font-size: .82rem; text-decoration: underline; }
    .bag-item .rm:hover { color: var(--danger); }
    .bag-item .line-total { font-family: var(--serif); font-size: 1.2rem; text-align: right; white-space: nowrap; }
    .summary { position: sticky; top: 90px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 26px; }
    .summary h3 { font-family: var(--sans); font-size: .82rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin-bottom: 18px; }
    .sum-row { display: flex; justify-content: space-between; padding: .5rem 0; color: var(--ink-soft); font-size: .95rem; }
    .sum-total { display: flex; justify-content: space-between; padding: 16px 0 4px; border-top: 1px solid var(--line); margin-top: 10px; font-weight: 700; font-size: 1.15rem; color: var(--ink); }
    .sum-total .v { font-family: var(--serif); font-size: 1.5rem; }
    .promo { display: flex; gap: 8px; margin: 16px 0; }
    .promo input { flex: 1; padding: .65rem .8rem; border: 1px solid var(--line); border-radius: var(--r-sm); font-family: inherit; }
    .trust { display: flex; gap: 10px; justify-content: center; margin-top: 16px; color: var(--muted); font-size: .78rem; }
    @media (max-width: 820px) { .bag-layout { grid-template-columns: 1fr; } .summary { position: static; } }
    @media (max-width: 520px) { .bag-item { grid-template-columns: 72px 1fr; } .bag-item img { width:72px;height:72px } .bag-item .line-total { grid-column: 2; text-align: left; } }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <div class="container">
    <div class="bag-head"><span class="eyebrow">Almost yours</span><h1>Your bag</h1></div>
    <div id="bag-root"><div class="spin"></div></div>
  </div>

  <div id="app-footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script>
    TSS.mountHeader('shop');
    TSS.mountFooter();

    const root = document.getElementById('bag-root');
    const TAX = 0.12, SHIP = 60;
    let items = [];

    function money(n){ return TSS.money(n); }

    function renderEmpty() {
      root.innerHTML = `<div class="empty"><div class="ic">🛍️</div><h3>Your bag is empty</h3><p>Discover gentle, effective skincare made for your routine.</p><a class="btn btn-primary" href="customer_dashboard.html" style="margin-top:12px">Start shopping</a></div>`;
    }

    function render() {
      if (!items.length) return renderEmpty();
      const subtotal = items.reduce((s,i)=> s + Number(i.price)*i.quantity, 0);
      const tax = subtotal * TAX;
      const total = subtotal + tax + SHIP;
      root.innerHTML = `
      <div class="bag-layout">
        <div class="bag-items">
          ${items.map(i => {
            const out = Number(i.stock) <= 0;
            return `
            <div class="bag-item" data-id="${i.id}" data-pid="${i.product_id}">
              <a href="product_view.html?id=${i.product_id}"><img src="${i.image||''}" onerror="this.src='https://via.placeholder.com/200?text=TSS'" alt="${i.name}"></a>
              <div>
                <a href="product_view.html?id=${i.product_id}" class="nm">${i.name}</a>
                <div class="unit">${money(i.price)} each ${out?'· <span style="color:var(--danger)">out of stock</span>':(Number(i.stock)<=5?'· only '+i.stock+' left':'')}</div>
                <div class="controls">
                  <div class="qty">
                    <button data-act="dec" ${i.quantity<=1?'disabled':''}>−</button>
                    <span class="qv">${i.quantity}</span>
                    <button data-act="inc" ${i.quantity>=Number(i.stock)?'disabled':''}>+</button>
                  </div>
                  <button class="rm" data-act="rm">Remove</button>
                </div>
              </div>
              <div class="line-total">${money(Number(i.price)*i.quantity)}</div>
            </div>`;
          }).join('')}
          <a href="customer_dashboard.html" class="btn btn-ghost btn-sm" style="align-self:flex-start">← Continue shopping</a>
        </div>

        <aside class="summary">
          <h3>Order summary</h3>
          <div class="sum-row"><span>Subtotal (${items.reduce((s,i)=>s+i.quantity,0)} items)</span><span>${money(subtotal)}</span></div>
          <div class="sum-row"><span>VAT (12%)</span><span>${money(tax)}</span></div>
          <div class="sum-row"><span>Shipping</span><span>${money(SHIP)}</span></div>
          <div class="promo">
            <input type="text" placeholder="Promo code" id="promo">
            <button class="btn btn-soft btn-sm" id="applyPromo">Apply</button>
          </div>
          <div class="sum-total"><span>Total</span><span class="v">${money(total)}</span></div>
          <button class="btn btn-primary btn-block btn-lg" id="checkoutBtn" style="margin-top:16px">Proceed to checkout</button>
          <div class="trust">🔒 Secure checkout · 7-day returns</div>
        </aside>
      </div>`;

      root.querySelectorAll('.bag-item').forEach(row => {
        const id = row.dataset.id, pid = Number(row.dataset.pid);
        const item = items.find(x => String(x.id) === String(id));
        row.querySelector('[data-act="inc"]').onclick = () => changeQty(pid, item.quantity + 1);
        row.querySelector('[data-act="dec"]').onclick = () => changeQty(pid, item.quantity - 1);
        row.querySelector('[data-act="rm"]').onclick = () => removeItem(id);
      });
      document.getElementById('checkoutBtn').onclick = () => location.href = 'checkout.html';
      document.getElementById('applyPromo').onclick = () => TSS.toast('Invalid or expired promo code', 'error');
    }

    async function changeQty(productId, qty) {
      if (qty < 1) return;
      try {
        const r = await fetch(`${TSS.API}/api/cart/update`, { method:'PUT', headers: TSS.authHeaders(), body: JSON.stringify({ productId, quantity: qty }) });
        const d = await r.json();
        if (!r.ok) { TSS.toast(d.error || 'Could not update', 'error'); return; }
        if (d.adjustedQuantity) TSS.toast(`Only ${d.maxStock} in stock — adjusted`, 'info');
        await load();
      } catch { TSS.toast('Network error', 'error'); }
    }

    async function removeItem(itemId) {
      try {
        const r = await fetch(`${TSS.API}/api/cart/${itemId}`, { method:'DELETE', headers: TSS.authHeaders() });
        if (r.ok) { TSS.toast('Removed from bag', 'info'); await load(); }
        else TSS.toast('Could not remove item', 'error');
      } catch { TSS.toast('Network error', 'error'); }
    }

    async function load() {
      const r = await fetch(`${TSS.API}/api/cart`, { headers: TSS.authHeaders() });
      items = await r.json();
      render();
      TSS.updateBadges();
    }

    (function init() {
      if (!TSS.requireLogin('Please sign in to view your bag')) return;
      load().catch(() => { root.innerHTML = '<div class="empty"><div class="ic">🌸</div><h3>Couldn\'t load your bag</h3><p>Is the backend running at '+TSS.API+'?</p></div>'; });
    })();
  </script>
</body>
</html>
