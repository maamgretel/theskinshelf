<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: blob: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Profile — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <style>
    .prof-layout { display: grid; grid-template-columns: 300px 1fr; gap: 26px; padding: 30px 0 60px; align-items: start; }
    .prof-side { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 28px; text-align: center; position: sticky; top: 90px; }
    .prof-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin: 0 auto 14px; background: var(--cream-2); border: 3px solid var(--paper); box-shadow: var(--sh); }
    .prof-side h2 { font-size: 1.3rem; }
    .prof-side .role { display: inline-block; margin-top: 6px; }
    .prof-side .upload { margin-top: 14px; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 28px; margin-bottom: 18px; }
    .card h3 { font-size: 1.2rem; margin-bottom: 4px; }
    .card .sub { color: var(--muted); font-size: .88rem; margin-bottom: 18px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    @media (max-width: 820px) { .prof-layout { grid-template-columns: 1fr; } .prof-side { position: static; } .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <div class="container">
    <div style="padding-top:30px"><span class="eyebrow">Your account</span><h1 style="font-size:clamp(1.8rem,3.5vw,2.6rem)">My profile</h1></div>
    <div id="root" class="prof-layout"><div class="spin"></div></div>
  </div>

  <div id="app-footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script>
    TSS.mountHeader('');
    TSS.mountFooter();
    const DEFAULT_AV = 'https://res.cloudinary.com/dwgvlwkyt/image/upload/v1751856106/default-avatar.jpg';
    const root = document.getElementById('root');

    if (!TSS.requireLogin('Please sign in to view your profile')) { /* redirect */ }
    else init();

    async function init() {
      let u;
      try { u = await (await fetch(`${TSS.API}/api/profile`, { headers: TSS.authHeaders() })).json(); }
      catch { root.innerHTML = '<div class="empty">Couldn\'t load profile</div>'; return; }
      if (u.error) { root.innerHTML = `<div class="empty"><h3>${u.error}</h3></div>`; return; }

      root.innerHTML = `
        <aside class="prof-side">
          <img class="prof-avatar" id="avatar" src="${u.profile_pic || DEFAULT_AV}" onerror="this.src='${DEFAULT_AV}'" alt="">
          <h2 id="dispName">${u.name || ''}</h2>
          <span class="badge badge-muted role">${(u.role||'customer')[0].toUpperCase()+(u.role||'customer').slice(1)}</span>
          <div class="upload">
            <input type="file" id="avaFile" accept="image/*" class="hide">
            <button class="btn btn-soft btn-sm btn-block" id="avaBtn">Change photo</button>
          </div>
          <p class="muted" style="font-size:.78rem;margin-top:14px">Member since ${u.created_at ? new Date(u.created_at).getFullYear() : '—'}</p>
        </aside>

        <div>
          <div class="card">
            <h3>Personal details</h3><div class="sub">Update your name and contact information.</div>
            <div class="grid2">
              <div class="field"><label>Full name</label><input id="f-name" value="${(u.name||'').replace(/"/g,'&quot;')}"></div>
              <div class="field"><label>Email</label><input id="f-email" type="email" value="${(u.email||'').replace(/"/g,'&quot;')}"></div>
            </div>
            <div class="field"><label>Contact number</label><input id="f-contact" value="${(u.contact_number||'').replace(/"/g,'&quot;')}" placeholder="09XX XXX XXXX"></div>
          </div>

          <div class="card">
            <h3>Delivery address</h3><div class="sub">Where we'll send your orders.</div>
            <div class="field"><label>Address</label><textarea id="f-address" rows="3" placeholder="House no., street, barangay, city, province, postal code">${u.address||''}</textarea></div>
          </div>

          <div class="card">
            <h3>Security</h3><div class="sub">Manage how you sign in.</div>
            <a class="btn btn-soft" href="forgot_password.html">Change password →</a>
          </div>

          <div style="display:flex;gap:12px">
            <button class="btn btn-primary btn-lg" id="saveBtn">Save changes</button>
            <a class="btn btn-ghost btn-lg" href="customer_dashboard.html">Back to shop</a>
          </div>
        </div>`;

      const avaFile = document.getElementById('avaFile'), avatar = document.getElementById('avatar');
      document.getElementById('avaBtn').onclick = () => avaFile.click();
      avaFile.onchange = () => { if (avaFile.files[0]) avatar.src = URL.createObjectURL(avaFile.files[0]); };

      document.getElementById('saveBtn').onclick = async (e) => {
        const btn = e.currentTarget;
        const fd = new FormData();
        fd.append('name', document.getElementById('f-name').value.trim());
        fd.append('email', document.getElementById('f-email').value.trim());
        fd.append('contact_number', document.getElementById('f-contact').value.trim());
        fd.append('address', document.getElementById('f-address').value.trim());
        if (avaFile.files[0]) fd.append('profile_pic', avaFile.files[0]);
        btn.disabled = true; btn.textContent = 'Saving…';
        try {
          const r = await fetch(`${TSS.API}/api/profile`, { method:'PUT', headers: { 'X-User-ID': String(TSS.user().id) }, body: fd });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || 'Could not save');
          // refresh cached user for the header
          const merged = { ...TSS.user(), ...(d.user || d) };
          localStorage.setItem('user', JSON.stringify(merged));
          TSS.toast('Profile updated ✓', 'success');
          document.getElementById('dispName').textContent = merged.name || '';
          TSS.mountHeader('');
        } catch (err) { TSS.toast(err.message, 'error'); }
        finally { btn.disabled = false; btn.textContent = 'Save changes'; }
      };
    }
  </script>
</body>
</html>
