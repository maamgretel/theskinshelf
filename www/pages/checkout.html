<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Checkout — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <style>
    .co-head { padding: 30px 0 6px; }
    .co-head h1 { font-size: clamp(1.8rem, 3.5vw, 2.6rem); }
    .steps { display: flex; gap: .5rem; align-items: center; color: var(--muted); font-size: .82rem; margin-top: .4rem; }
    .steps b { color: var(--accent); }
    .co-layout { display: grid; grid-template-columns: 1fr 380px; gap: 34px; align-items: start; padding: 20px 0 70px; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 26px; margin-bottom: 18px; }
    .card h3 { font-size: 1.2rem; margin-bottom: 4px; }
    .card .sub { color: var(--muted); font-size: .88rem; margin-bottom: 18px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .pay-opt { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: border-color .2s, background .2s; }
    .pay-opt.sel { border-color: var(--accent); background: var(--accent-soft); }
    .pay-opt .em { font-size: 1.4rem; }
    .pay-opt .t { font-weight: 600; }
    .pay-opt .d { font-size: .82rem; color: var(--muted); }
    .pay-opt input { margin-left: auto; accent-color: var(--accent); width: 18px; height: 18px; }
    .summary { position: sticky; top: 90px; }
    .co-items { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; max-height: 280px; overflow-y: auto; }
    .co-item { display: flex; gap: 12px; align-items: center; }
    .co-item img { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; background: var(--cream-2); }
    .co-item .nm { font-weight: 600; font-size: .9rem; }
    .co-item .q { color: var(--muted); font-size: .8rem; }
    .co-item .lt { margin-left: auto; font-weight: 600; }
    .sum-row { display: flex; justify-content: space-between; padding: .45rem 0; color: var(--ink-soft); font-size: .95rem; }
    .sum-total { display: flex; justify-content: space-between; padding: 14px 0 4px; border-top: 1px solid var(--line); margin-top: 8px; font-weight: 700; }
    .sum-total .v { font-family: var(--serif); font-size: 1.5rem; }
    /* success */
    .success { text-align: center; max-width: 560px; margin: 40px auto; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 54px 30px; }
    .success .check { width: 78px; height: 78px; border-radius: 50%; background: var(--success); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 20px; animation: pop .4s ease; }
    @keyframes pop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
    .success h1 { font-size: 2rem; margin-bottom: .4rem; }
    .success .ordno { display: inline-block; background: var(--cream-2); padding: .4rem 1rem; border-radius: var(--r-pill); font-weight: 700; margin: 10px 0 20px; }
    @media (max-width: 860px) { .co-layout { grid-template-columns: 1fr; } .summary { position: static; } .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <div class="container">
    <div class="co-head"><span class="eyebrow">Checkout</span><h1>Complete your order</h1>
      <div class="steps"><span>Bag</span> → <b>Details &amp; payment</b> → <span>Done</span></div>
    </div>
    <div id="co-root"><div class="spin"></div></div>
  </div>
  <div id="app-footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script>
    TSS.mountHeader('shop');
    TSS.mountFooter();
    const root = document.getElementById('co-root');
    const TAX = 0.12, SHIP = 60;
    let data = { items: [], deliveryInfo: {} };
    let payment = 'cod';

    function form(di) {
      const [name, contact] = [di.name || (TSS.user()||{}).name || '', di.contact_number || ''];
      root.innerHTML = `
      <div class="co-layout">
        <div>
          <div class="card">
            <h3>Delivery details</h3>
            <div class="sub">Where should we send your order?</div>
            <div class="field"><label>Full name</label><input id="f-name" value="${name}" placeholder="Juan Dela Cruz" required></div>
            <div class="field"><label>Contact number</label><input id="f-contact" value="${contact}" placeholder="09XX XXX XXXX" required></div>
            <div class="field"><label>Street address</label><input id="f-street" value="${di.address ? String(di.address).replace(/"/g,'&quot;') : ''}" placeholder="House no., street, purok" required></div>
            <div class="grid2">
              <div class="field"><label>Barangay</label><input id="f-brgy" placeholder="Barangay"></div>
              <div class="field"><label>City / Municipality</label><input id="f-city" placeholder="City" required></div>
            </div>
            <div class="grid2">
              <div class="field"><label>Province</label><input id="f-prov" placeholder="Province" required></div>
              <div class="field"><label>Postal code</label><input id="f-postal" placeholder="6000"></div>
            </div>
          </div>

          <div class="card">
            <h3>Payment method</h3>
            <div class="sub">No real payment is taken — this is a demo store.</div>
            <div class="pay-opt sel" data-pay="cod">
              <span class="em">💵</span><div><div class="t">Cash on Delivery</div><div class="d">Pay with cash when your order arrives</div></div>
              <input type="radio" name="pay" checked>
            </div>
            <div class="pay-opt" data-pay="card">
              <span class="em">💳</span><div><div class="t">Credit / Debit card</div><div class="d">Visa, Mastercard (demo — not charged)</div></div>
              <input type="radio" name="pay">
            </div>
            <div id="card-fields" class="hide" style="margin-top:14px">
              <div class="field"><label>Card number</label><input id="f-card" placeholder="4242 4242 4242 4242" maxlength="19"></div>
              <div class="grid2">
                <div class="field"><label>Expiry</label><input id="f-exp" placeholder="MM/YY" maxlength="5"></div>
                <div class="field"><label>CVV</label><input id="f-cvv" placeholder="123" maxlength="4"></div>
              </div>
            </div>
          </div>
        </div>

        <aside class="summary">
          <div class="card">
            <h3>Your order</h3>
            <div class="sub">${data.items.length} item(s)</div>
            <div class="co-items" id="co-items"></div>
            <div class="sum-row"><span>Subtotal</span><span id="s-sub"></span></div>
            <div class="sum-row"><span>VAT (12%)</span><span id="s-tax"></span></div>
            <div class="sum-row"><span>Shipping</span><span id="s-ship"></span></div>
            <div class="sum-total"><span>Total</span><span class="v" id="s-total"></span></div>
            <button class="btn btn-primary btn-block btn-lg" id="placeBtn" style="margin-top:16px">Place order</button>
            <div style="text-align:center;color:var(--muted);font-size:.78rem;margin-top:12px">🔒 Your details are safe with us</div>
          </div>
        </aside>
      </div>`;

      renderItems();
      root.querySelectorAll('.pay-opt').forEach(o => o.onclick = () => {
        root.querySelectorAll('.pay-opt').forEach(x => x.classList.remove('sel'));
        o.classList.add('sel'); o.querySelector('input').checked = true;
        payment = o.dataset.pay;
        document.getElementById('card-fields').classList.toggle('hide', payment !== 'card');
      });
      document.getElementById('placeBtn').onclick = placeOrder;
    }

    function renderItems() {
      const box = document.getElementById('co-items');
      box.innerHTML = data.items.map(i => `
        <div class="co-item">
          <img src="${i.image||''}" onerror="this.src=window.TSS_PLACEHOLDER" alt="">
          <div><div class="nm">${i.name}</div><div class="q">Qty ${i.quantity} · ${TSS.money(i.price)}</div></div>
          <div class="lt">${TSS.money(Number(i.price)*i.quantity)}</div>
        </div>`).join('');
      const sub = data.items.reduce((s,i)=>s+Number(i.price)*i.quantity,0);
      const tax = sub*TAX, total = sub+tax+SHIP;
      document.getElementById('s-sub').textContent = TSS.money(sub);
      document.getElementById('s-tax').textContent = TSS.money(tax);
      document.getElementById('s-ship').textContent = TSS.money(SHIP);
      document.getElementById('s-total').textContent = TSS.money(total);
    }

    async function placeOrder() {
      const v = id => (document.getElementById(id).value || '').trim();
      const name = v('f-name'), contact = v('f-contact'), street = v('f-street'), city = v('f-city'), prov = v('f-prov');
      if (!name || !contact || !street || !city || !prov) { TSS.toast('Please complete the required delivery fields', 'error'); return; }
      if (!/^[0-9+\-\s]{7,}$/.test(contact)) { TSS.toast('Please enter a valid contact number', 'error'); return; }
      const address = [street, v('f-brgy'), city, prov, v('f-postal')].filter(Boolean).join(', ');
      const btn = document.getElementById('placeBtn');
      btn.disabled = true; btn.textContent = 'Placing your order…';
      try {
        // 1) save delivery address
        const a = await fetch(`${TSS.API}/api/checkout/address`, { method:'PUT', headers: TSS.authHeaders(), body: JSON.stringify({ address, contact_number: contact }) });
        if (!a.ok) { const e = await a.json().catch(()=>({})); throw new Error(e.error || 'Could not save address'); }
        // 2) place order
        const r = await fetch(`${TSS.API}/api/orders/place`, { method:'POST', headers: TSS.authHeaders(), body: JSON.stringify({ payment_method: payment }) });
        const d = await r.json();
        if (!r.ok) { throw new Error(d.error || (d.stock_issues ? 'Some items are out of stock' : 'Could not place order')); }
        TSS.updateBadges();
        showSuccess(d);
      } catch (err) {
        TSS.toast(err.message || 'Something went wrong', 'error');
        btn.disabled = false; btn.textContent = 'Place order';
      }
    }

    function showSuccess(d) {
      const s = d.orderSummary || {};
      root.innerHTML = `
      <div class="success">
        <div class="check">✓</div>
        <span class="eyebrow" style="color:var(--success)">Order confirmed</span>
        <h1>Thank you for your order!</h1>
        <p class="muted">A confirmation has been sent to your account. We'll get your skincare on its way.</p>
        <div class="ordno">Order ${d.orderNumber || '#' + (d.order_ids||[]).join(', ')}</div>
        <div style="max-width:320px;margin:0 auto 24px;text-align:left">
          <div class="sum-row"><span>Merchandise</span><span>${TSS.money(s.merchandise_total||0)}</span></div>
          <div class="sum-row"><span>VAT</span><span>${TSS.money(s.tax_amount||0)}</span></div>
          <div class="sum-row"><span>Shipping</span><span>${TSS.money(s.shipping_fee||0)}</span></div>
          <div class="sum-total"><span>Total paid</span><span class="v">${TSS.money(s.grand_total||0)}</span></div>
        </div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <a class="btn btn-primary" href="my_orders.html">Track my order</a>
          <a class="btn btn-outline" href="customer_dashboard.html">Continue shopping</a>
        </div>
      </div>`;
    }

    (async function init() {
      if (!TSS.requireLogin('Please sign in to check out')) return;
      try {
        const r = await fetch(`${TSS.API}/api/checkout`, { headers: TSS.authHeaders() });
        if (r.status === 403) { root.innerHTML = '<div class="empty"><div class="ic">🔒</div><h3>Customers only</h3><p>Sign in with a customer account to check out.</p></div>'; return; }
        data = await r.json();
        if (!data.items || !data.items.length) {
          root.innerHTML = '<div class="empty"><div class="ic">🛍️</div><h3>Your bag is empty</h3><p>Add some products before checking out.</p><a class="btn btn-primary" href="customer_dashboard.html" style="margin-top:12px">Shop now</a></div>';
          return;
        }
        form(data.deliveryInfo || {});
      } catch (e) {
        root.innerHTML = '<div class="empty"><div class="ic">🌸</div><h3>Couldn\'t load checkout</h3><p>Is the backend running at '+TSS.API+'?</p></div>';
      }
    })();
  </script>
</body>
</html>
