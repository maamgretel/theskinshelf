<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <style>.auth-aside::after { background-image: var(--bg); }</style>
</head>
<body>
  <div class="auth-wrap">
    <aside class="auth-aside" style="--bg:url('https://images.unsplash.com/photo-1631730359585-38a4935cbec4?w=900&q=80&auto=format&fit=crop')">
      <a class="brand" href="../index.html"><span class="dot"></span> The Skin Shelf</a>
      <div class="pitch">
        <h2>Welcome back to your ritual.</h2>
        <p>Sign in to shop clean skincare, track your orders and pick up where you left off.</p>
      </div>
      <div class="quotes">
        <div class="q"><b>4.8★</b> average rating</div>
        <div class="q"><b>2,400+</b> happy customers</div>
      </div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <span class="eyebrow">Account</span>
        <h1>Sign in</h1>
        <p class="lede">Enter your details to continue.</p>

        <div class="auth-alert err" id="alert"></div>

        <form id="loginForm">
          <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@email.com" required></div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input type="password" id="password" name="password" placeholder="••••••••" required>
              <button type="button" class="toggle" data-toggle="password">Show</button>
            </div>
          </div>
          <div style="text-align:right;margin:-4px 0 16px"><a href="forgot_password.html" style="font-size:.85rem;color:var(--accent);font-weight:600">Forgot password?</a></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Sign in</button>
        </form>

        <div class="debug-otp" style="margin-top:1.4rem">
          <div style="margin-bottom:6px">Demo accounts — tap to fill</div>
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button class="chip" data-demo="customer@skinshelf.com|Customer123!">Customer</button>
            <button class="chip" data-demo="seller@skinshelf.com|Seller123!">Seller</button>
            <button class="chip" data-demo="admin@skinshelf.com|Admin123!">Admin</button>
          </div>
        </div>

        <div class="foot">New here? <a href="register.html">Create an account</a></div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script>
    const alertEl = document.getElementById('alert');
    function showErr(m) { alertEl.textContent = m; alertEl.className = 'auth-alert err show'; }

    document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
      const inp = document.getElementById(b.dataset.toggle);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      b.textContent = inp.type === 'password' ? 'Show' : 'Hide';
    });
    document.querySelectorAll('[data-demo]').forEach(b => b.onclick = () => {
      const [e, p] = b.dataset.demo.split('|');
      document.getElementById('email').value = e;
      document.getElementById('password').value = p;
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.className = 'auth-alert';
      const btn = document.getElementById('submitBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const r = await fetch(`${TSS.API}/api/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || d.message || 'Invalid email or password');
        localStorage.setItem('user', JSON.stringify(d.user));
        if (d.user.role === 'seller') sessionStorage.setItem('sellerId', d.user.id);
        alertEl.textContent = 'Welcome back! Redirecting…'; alertEl.className = 'auth-alert ok show';
        const dest = d.user.role === 'admin' ? 'admin_dashboard.html' : d.user.role === 'seller' ? 'seller_dashboard.html' : 'customer_dashboard.html';
        const back = sessionStorage.getItem('returnTo'); sessionStorage.removeItem('returnTo');
        setTimeout(() => location.href = (back && d.user.role === 'customer') ? back : dest, 600);
      } catch (err) {
        showErr(err.message);
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
