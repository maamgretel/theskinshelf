<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sellers — Admin — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="../css/seller.css">
  <style>
    .seller-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; padding-bottom:60px; }
    .seller-card { background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg); padding:22px; }
    .seller-card .head { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
    .seller-card .head img { width:52px; height:52px; border-radius:50%; object-fit:cover; background:var(--cream-2); }
    .seller-card .head .nm { font-weight:700; }
    .seller-card .head .em { font-size:.8rem; color:var(--muted); }
    .seller-card .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:14px; }
    .seller-card .stats .v { font-family:var(--serif); font-size:1.2rem; }
    .seller-card .stats .l { font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    .seller-card .acts { display:flex; gap:8px; }
  </style>
</head>
<body>
  <div id="admin-header"></div>
  <div class="container">
    <div class="page-head"><div><span class="eyebrow">Admin</span><h1>Sellers</h1><p id="sub">The shops on your platform.</p></div></div>
    <div class="seller-grid" id="grid"><div class="spin"></div></div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/seller.js"></script>
  <script>
    const DEFAULT_AV = 'https://res.cloudinary.com/dwgvlwkyt/image/upload/v1751856106/default-avatar.jpg';
    let all = [];
    if (SELLER.requireAdmin()) { SELLER.mountAdminTopbar('sellers'); load(); }

    async function load() {
      const grid = document.getElementById('grid');
      try {
        all = (await SELLER.api('/api/admin/sellers')).sellers || [];
        document.getElementById('sub').textContent = `${all.length} seller${all.length===1?'':'s'} on your platform.`;
        if (!all.length) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="ic">🏪</div><h3>No sellers yet</h3></div>'; return; }
        grid.innerHTML = all.sort((a,b)=>b.total_sales-a.total_sales).map(s => `
          <div class="seller-card" data-id="${s.id}">
            <div class="head">
              <img src="${s.profile_pic||DEFAULT_AV}" onerror="this.src='${DEFAULT_AV}'">
              <div><div class="nm">${s.name}</div><div class="em">${s.email}</div></div>
            </div>
            <div class="stats">
              <div><div class="v">${s.product_count}</div><div class="l">Products</div></div>
              <div><div class="v">${s.total_orders}</div><div class="l">Orders</div></div>
              <div><div class="v" style="font-size:.95rem">${TSS.money(s.total_sales)}</div><div class="l">Sales</div></div>
            </div>
            <div class="acts">
              <a class="act-btn" href="product_seller.html" style="flex:1;text-align:center" title="Preview shop">View shop</a>
              <button class="act-btn danger" data-del="${s.id}">Remove</button>
            </div>
          </div>`).join('');
        grid.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removeSeller(Number(b.dataset.del)));
      } catch (e) { grid.innerHTML = `<div class="empty" style="grid-column:1/-1">Couldn't load — ${e.message}</div>`; }
    }

    async function removeSeller(id) {
      const s = all.find(x=>x.id===id);
      const ok = await SELLER.confirm('Remove this seller?', `“${s.name}” and all their products/orders will be permanently deleted.`, 'Remove seller', true);
      if (!ok) return;
      try {
        await SELLER.api(`/api/admin/sellers/${id}`, { method:'DELETE' });
        TSS.toast('Seller removed', 'info');
        await load();
      } catch (e) { TSS.toast(e.message, 'error'); }
    }
  </script>
</body>
</html>
