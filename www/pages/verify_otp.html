<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Verify your email — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <style>.auth-aside::after { background-image: var(--bg); }</style>
</head>
<body>
  <div class="auth-wrap">
    <aside class="auth-aside" style="--bg:url('https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=900&q=80&auto=format&fit=crop')">
      <a class="brand" href="../index.html"><span class="dot"></span> The Skin Shelf</a>
      <div class="pitch">
        <h2>Almost there.</h2>
        <p>We've sent a 6-digit verification code to your email. Enter it to activate your account.</p>
      </div>
      <div class="quotes"><div class="q">🔒 Your account, secured</div></div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <span class="eyebrow">Verify email</span>
        <h1>Enter your code</h1>
        <p class="lede">Sent to <b id="emailLine">your email</b>.</p>

        <div class="auth-alert err" id="alert"></div>

        <form id="otpForm">
          <div class="otp-inputs" id="otpBoxes">
            <input inputmode="numeric" maxlength="1" aria-label="digit 1">
            <input inputmode="numeric" maxlength="1" aria-label="digit 2">
            <input inputmode="numeric" maxlength="1" aria-label="digit 3">
            <input inputmode="numeric" maxlength="1" aria-label="digit 4">
            <input inputmode="numeric" maxlength="1" aria-label="digit 5">
            <input inputmode="numeric" maxlength="1" aria-label="digit 6">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" style="margin-top:16px">Verify &amp; continue</button>
        </form>

        <div id="debugBox" class="debug-otp" style="display:none">Local demo code: <b id="debugOtp"></b></div>

        <div class="foot">Didn't get it? <a href="#" id="resend">Resend code</a> · <a href="register.html">Change email</a></div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script>
    const email = sessionStorage.getItem('pendingEmail');
    const alertEl = document.getElementById('alert');
    function showErr(m){ alertEl.textContent = m; alertEl.className = 'auth-alert err show'; }
    if (!email) { location.href = 'register.html'; }
    document.getElementById('emailLine').textContent = email || '';

    const dbg = sessionStorage.getItem('debugOtp');
    if (dbg) { document.getElementById('debugBox').style.display = 'block'; document.getElementById('debugOtp').textContent = dbg; }

    // otp box UX
    const boxes = [...document.querySelectorAll('#otpBoxes input')];
    boxes.forEach((b, i) => {
      b.addEventListener('input', () => { b.value = b.value.replace(/\D/g, ''); if (b.value && i < 5) boxes[i+1].focus(); });
      b.addEventListener('keydown', e => { if (e.key === 'Backspace' && !b.value && i > 0) boxes[i-1].focus(); });
      b.addEventListener('paste', e => {
        const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
        if (t) { e.preventDefault(); t.split('').forEach((c, k) => { if (boxes[k]) boxes[k].value = c; }); boxes[Math.min(t.length, 5)].focus(); }
      });
    });
    boxes[0].focus();

    document.getElementById('otpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.className = 'auth-alert';
      const otp = boxes.map(b => b.value).join('');
      if (otp.length !== 6) { showErr('Please enter all 6 digits'); return; }
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Verifying…';
      try {
        const r = await fetch(`${TSS.API}/api/auth/verify-registration`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, otp }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || d.message || 'Invalid code');
        alertEl.textContent = 'Account verified! Redirecting to sign in…'; alertEl.className = 'auth-alert ok show';
        sessionStorage.removeItem('pendingEmail'); sessionStorage.removeItem('debugOtp');
        setTimeout(() => location.href = 'login.html', 900);
      } catch (err) {
        showErr(err.message);
        btn.disabled = false; btn.textContent = 'Verify & continue';
      }
    });

    document.getElementById('resend').addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        const r = await fetch(`${TSS.API}/api/auth/resend-otp`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || d.message || 'Could not resend');
        if (d.debug_otp) { document.getElementById('debugBox').style.display = 'block'; document.getElementById('debugOtp').textContent = d.debug_otp; }
        alertEl.textContent = 'A new code has been sent.'; alertEl.className = 'auth-alert ok show';
      } catch (err) { showErr(err.message); }
    });
  </script>
</body>
</html>
