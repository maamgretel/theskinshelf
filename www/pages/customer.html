<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Customers — Admin — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="../css/seller.css">
  <style>.toolbar{display:flex;gap:12px;margin-bottom:16px}.toolbar .input-search{flex:1;max-width:360px}.page-wrap{padding-bottom:60px}.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--cream-2)}</style>
</head>
<body>
  <div id="admin-header"></div>
  <div class="container page-wrap">
    <div class="page-head"><div><span class="eyebrow">Admin</span><h1>Customers</h1><p id="sub">People shopping on The Skin Shelf.</p></div></div>
    <div class="toolbar"><div class="input-search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="search" placeholder="Search customers…"></div></div>
    <div class="panel" style="padding:10px 18px">
      <div class="tbl-wrap"><table class="tbl" id="tbl">
        <thead><tr><th>Customer</th><th>Contact</th><th>Orders</th><th>Total spent</th><th>Last order</th><th>Joined</th></tr></thead>
        <tbody><tr><td colspan="6"><div class="spin"></div></td></tr></tbody>
      </table></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/seller.js"></script>
  <script>
    const DEFAULT_AV = 'https://res.cloudinary.com/dwgvlwkyt/image/upload/v1751856106/default-avatar.jpg';
    let all = [], search = '';
    if (SELLER.requireAdmin()) { SELLER.mountAdminTopbar('customers'); load(); }

    async function load() {
      try { all = (await SELLER.api('/api/admin/customers')).customers || []; document.getElementById('sub').textContent = `${all.length} customers.`; render(); }
      catch (e) { document.querySelector('#tbl tbody').innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px">Couldn't load — ${e.message}</td></tr>`; }
    }
    document.getElementById('search').addEventListener('input', e => { search = e.target.value.toLowerCase().trim(); render(); });

    function render() {
      let rows = all;
      if (search) rows = rows.filter(c => (c.name||'').toLowerCase().includes(search) || (c.email||'').toLowerCase().includes(search));
      const tb = document.querySelector('#tbl tbody');
      if (!rows.length) { tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:26px">No customers found</td></tr>'; return; }
      tb.innerHTML = rows.map(c => `
        <tr>
          <td><div class="prod-cell"><img class="av" src="${c.profile_pic||DEFAULT_AV}" onerror="this.src='${DEFAULT_AV}'"><div><div class="nm">${c.name}</div><div class="cat">${c.email}</div></div></div></td>
          <td>${c.contact_number || '—'}</td>
          <td class="num">${c.total_orders ?? 0}</td>
          <td class="num"><b>${TSS.money(c.total_spent || 0)}</b></td>
          <td class="num">${c.last_order_date ? new Date(c.last_order_date).toLocaleDateString('en-PH',{month:'short',day:'numeric'}) : '—'}</td>
          <td class="num">${c.created_at ? new Date(c.created_at).toLocaleDateString('en-PH',{month:'short',year:'numeric'}) : '—'}</td>
        </tr>`).join('');
    }
  </script>
</body>
</html>
