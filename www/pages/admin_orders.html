<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://backend-rj0a.onrender.com;
    img-src 'self' data: https:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    script-src 'self' 'unsafe-inline';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orders — Admin — The Skin Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧴</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="../css/seller.css">
  <style>
    .toolbar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .toolbar .input-search { flex:1; min-width:220px; }
    .status-sel { padding:.35rem .6rem; border:1px solid var(--line); border-radius:var(--r-pill); font-family:inherit; font-size:.8rem; font-weight:600; background:var(--paper); }
    .page-wrap { padding-bottom:60px; }
  </style>
</head>
<body>
  <div id="admin-header"></div>
  <div class="container page-wrap">
    <div class="page-head"><div><span class="eyebrow">Admin</span><h1>All orders</h1><p id="sub">Every order across the platform.</p></div></div>
    <div class="status-tabs chip-row" id="tabs"></div>
    <div class="toolbar">
      <div class="input-search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="search" placeholder="Search by product, customer…"></div>
    </div>
    <div class="panel" style="padding:10px 18px">
      <div class="tbl-wrap"><table class="tbl" id="tbl">
        <thead><tr><th>#</th><th>Product</th><th>Customer</th><th>Qty</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
        <tbody><tr><td colspan="7"><div class="spin"></div></td></tr></tbody>
      </table></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/seller.js"></script>
  <script>
    const STATUSES = ['All','Pending','Shipped','Delivered','Cancelled'];
    let all = [], active = 'All', search = '';
    if (SELLER.requireAdmin()) { SELLER.mountAdminTopbar('orders'); load(); }

    async function load() {
      try { all = (await SELLER.api('/api/admin/orders')).orders || []; renderTabs(); render(); }
      catch (e) { document.querySelector('#tbl tbody').innerHTML = `<tr><td colspan="7" style="text-align:center;padding:24px">Couldn't load — ${e.message}</td></tr>`; }
    }
    function renderTabs() {
      const c = s => s==='All'?all.length:all.filter(o=>o.status===s).length;
      document.getElementById('tabs').innerHTML = STATUSES.map(s=>`<button class="chip ${active===s?'active':''}" data-s="${s}">${s} (${c(s)})</button>`).join('');
      document.querySelectorAll('#tabs .chip').forEach(b=>b.onclick=()=>{active=b.dataset.s;renderTabs();render();});
      document.getElementById('sub').textContent = `${all.length} orders across the platform.`;
    }
    document.getElementById('search').addEventListener('input', e => { search = e.target.value.toLowerCase().trim(); render(); });

    function render() {
      let rows = active==='All'?all:all.filter(o=>o.status===active);
      if (search) rows = rows.filter(o => (o.product_name||'').toLowerCase().includes(search) || (o.customer_name||'').toLowerCase().includes(search) || String(o.id)===search);
      rows = rows.sort((a,b)=>new Date(b.order_date)-new Date(a.order_date));
      const tb = document.querySelector('#tbl tbody');
      if (!rows.length) { tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:26px">No matching orders</td></tr>'; return; }
      tb.innerHTML = rows.map(o => `
        <tr data-id="${o.id}">
          <td class="num"><b>#${o.id}</b></td>
          <td><div class="prod-cell"><img src="${o.product_image||''}" onerror="this.src=window.TSS_PLACEHOLDER"><div class="nm">${o.product_name}</div></div></td>
          <td>${o.customer_name || '—'}<div class="cat">${o.customer_email||''}</div></td>
          <td class="num">${o.quantity}</td>
          <td class="num"><b>${TSS.money(o.total_price)}</b></td>
          <td>
            <select class="status-sel" data-status="${o.id}">
              ${['Pending','Shipped','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
            </select>
          </td>
          <td class="num">${new Date(o.order_date).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})}</td>
        </tr>`).join('');
      tb.querySelectorAll('[data-status]').forEach(sel => sel.onchange = () => changeStatus(Number(sel.dataset.status), sel.value, sel));
    }

    async function changeStatus(id, status, sel) {
      sel.disabled = true;
      try {
        await SELLER.api('/api/admin/bulk/update-order-status', { method:'POST', body: JSON.stringify({ order_ids:[id], status }) });
        const o = all.find(x=>x.id===id); if (o) o.status = status;
        TSS.toast(`Order #${id} → ${status}`, 'success');
        renderTabs();
      } catch (e) { TSS.toast(e.message, 'error'); }
      finally { sel.disabled = false; }
    }
  </script>
</body>
</html>
